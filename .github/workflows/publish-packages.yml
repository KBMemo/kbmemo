name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run only (no upload)
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify publish metadata
        run: npm run verify:publish

      - name: Publish packages
        env:
          NPM_PUBLISH_REGISTRY: ${{ secrets.NPM_PUBLISH_REGISTRY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run publish:packages -- --dry-run
          else
            npm run publish:packages
          fi
