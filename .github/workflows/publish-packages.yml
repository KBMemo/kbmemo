name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run only (no upload)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify publish metadata
        run: npm run verify:publish

      - name: Dry-run package publish
        if: inputs.dry_run
        run: npm run publish:packages -- --dry-run

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          NPM_PUBLISH_REGISTRY: ${{ secrets.NPM_PUBLISH_REGISTRY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish:packages
