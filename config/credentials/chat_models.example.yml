# Chat エージェント接続情報（bin/rails credentials:edit で development / production それぞれに設定）
#
# 役割マッピング（provider / model / temperature）は config/chat_models.yml。
# ここには接続先 base_url と機密（API キー・SearXNG URL）だけを置く。
#
# 開発 (development):
#   base_url は省略可。省略時は balvenie 上の llama-server 既定ポートを使う:
#     intent=10010 / fast_chat=10011 / main=10011 / vision=10021 / embedding=10020 / image_generation=11234
#   chat-reason（12B）は任意。CHAT_ESCALATION=true かつ main を 10012 に向けたときだけ昇格先に使う。
#   ホストは ENV CHAT_LLM_HOST（既定 http://balvenie）。アカウント別の URL は Chat サーバー設定画面で役割ごとに指定。
#
# 本番 (production):
#   各役割の base_url を明示する（環境既定は使わない）。
#
# chat_models:
#   base_urls:
#     intent: http://balvenie:10010
#     fast_chat: http://balvenie:10011
#     main: http://balvenie:10011
#     vision: http://balvenie:10021
#     embedding: http://balvenie:10020
#     image_generation: http://localhost:11234
#   # OpenAI 互換のリモート provider を role で使う場合のみ:
#   api_keys:
#     main: sk-...
#   # Web 検索ツール（Phase 4）:
#   searxng_url: http://localhost:8888
