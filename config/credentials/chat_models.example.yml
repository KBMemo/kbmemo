# Chat エージェント接続情報（bin/rails credentials:edit で development / production それぞれに設定）
#
# 役割マッピング（provider / model / temperature）は config/chat_models.yml。
# ここには接続先 base_url と機密（API キー・SearXNG URL）だけを置く。
#
# 開発 (development):
#   base_url は省略可。省略時は役割ごとの localhost 既定ポートを使う:
#     intent=10031 / fast_chat=10032 / main=10010 / vision=10033 / embedding=10034 / image_generation=11234
#   （llama-server / sd.cpp をこれらのポートで起動しておく）
#
# 本番 (production):
#   各役割の base_url を明示する（localhost 既定は使わない）。
#
# chat_models:
#   base_urls:
#     intent: http://localhost:10031
#     fast_chat: http://localhost:10032
#     main: http://localhost:10010
#     vision: http://localhost:10033
#     embedding: http://localhost:10034   # llama-server --embeddings (LFM2.5-Embedding-350M)
#     image_generation: http://localhost:11234
#   # OpenAI 互換のリモート provider を role で使う場合のみ:
#   api_keys:
#     main: sk-...
#   # Web 検索ツール（Phase 4）:
#   searxng_url: http://localhost:8888
