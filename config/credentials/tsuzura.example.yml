# Tsuzura 連携（bin/rails credentials:edit で development / production それぞれに設定）
#
# 開発 (development):
#   KBMemo は既定で http://localhost:3008（kbmemo-media を PORT=3008 で起動）。
#   credentials の public_url / base_url は development では参照しない。
#   本番 API を試すときだけ shell で TSUZURA_BASE_URL / TSUZURA_PUBLIC_URL を export。
#
# 本番 (production):
#   public_url: https://media.kbmemo.net
#   base_url: https://media.kbmemo.net   # 省略時は public_url と同様
#   internal_secret: （kbmemo-media の KBMEMO_TSUZURA_INTERNAL_SECRET と同一）
#   url_signing_secret: （kbmemo-media の TSUZURA_URL_SIGNING_SECRET と同一推奨）

# tsuzura:
#   public_url: https://media.kbmemo.net
#   internal_secret: your-secret
#   url_signing_secret: your-signing-secret
