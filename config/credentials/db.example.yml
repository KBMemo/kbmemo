# bin/rails credentials:edit に追記する DB 設定の例。
# このファイル自体は参照されない（テンプレートのみ）。
# 詳細: docs/architecture/database.adoc

db:
  development:
    host: db.example.com
    port: 5432
    username: kbmemo
    password: your_development_password
    database: kbmemo_development

  test:
    host: db.example.com
    port: 5432
    username: kbmemo
    password: your_test_password
    database: kbmemo_test

  production:
    host: localhost
    port: 5432
    username: kbmemo
    password: your_production_password
    database: kbmemo_production
    cache_database: kbmemo_production_cache
    queue_database: kbmemo_production_queue
    cable_database: kbmemo_production_cable
