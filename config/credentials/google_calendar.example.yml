# bin/rails credentials:edit に追記する Google Calendar OAuth の例。
# このファイル自体は参照されない（テンプレートのみ）。
# Google Cloud Console: Calendar API 有効化 + OAuth 2.0 クライアント（Web アプリ）
# 承認済みリダイレクト URI: https://kbmemo.example.com/google_calendar/callback（本番）
# 開発例: http://localhost:3000/google_calendar/callback
# PORT を変えている場合（Talisker は 3010）はそのポートも完全一致で追加する。
# 例: http://localhost:3010/google_calendar/callback

google_calendar:
  client_id: your-client-id.apps.googleusercontent.com
  client_secret: your-client-secret
