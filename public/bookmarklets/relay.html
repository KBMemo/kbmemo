<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kbmemo に保存中…</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem;
        line-height: 1.5;
        color: #1a1a1a;
      }

      p {
        margin: 0;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .actions a,
      .actions button {
        font: inherit;
        padding: 0.4rem 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }

      .actions a.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <p id="status">kbmemo に送信中…</p>
    <script>
      ;(() => {
        const RELAY_READY = 'kbmemo-clip-relay-ready'
        const CLIP = 'kbmemo-clip'
        const CLIP_DONE = 'kbmemo-clip-done'
        const statusEl = document.getElementById('status')

        function setStatus(text) {
          if (statusEl) statusEl.textContent = text
        }

        function showSuccessActions(data) {
          setStatus('kbmemo に保存しました。')

          const actions = document.createElement('div')
          actions.className = 'actions'

          const openPath = data && (data.show_path || data.edit_path)
          if (openPath) {
            const openLink = document.createElement('a')
            openLink.href = openPath
            openLink.target = '_blank'
            openLink.rel = 'noopener'
            openLink.className = 'primary'
            openLink.textContent = 'メモを開く'
            openLink.addEventListener('click', () => {
              window.setTimeout(() => window.close(), 0)
            })
            actions.appendChild(openLink)
          }

          const closeBtn = document.createElement('button')
          closeBtn.type = 'button'
          closeBtn.textContent = '閉じる'
          closeBtn.addEventListener('click', () => window.close())
          actions.appendChild(closeBtn)

          if (statusEl) statusEl.after(actions)
        }

        if (!window.opener) {
          setStatus('このページはブックマークレットから開いてください。')
          return
        }

        window.opener.postMessage({ type: RELAY_READY }, '*')

        window.addEventListener('message', (event) => {
          if (event.source !== window.opener) return
          if (!event.data || event.data.type !== CLIP) return

          const token = (event.data.token || '').trim()
          if (!/^kbmemo_clip_/.test(token)) {
            setStatus('Web クリップトークンが無効です。')
            window.opener.postMessage(
              { type: CLIP_DONE, ok: false, error: 'invalid token' },
              '*'
            )
            return
          }

          setStatus(event.data.mode === 'summary' ? 'サマリーを生成中…' : 'kbmemo に送信中…')

          fetch('/api/clips', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({
              html: event.data.html,
              url: event.data.url,
              title: event.data.title,
              plain: event.data.plain,
              mode: event.data.mode,
            }),
          })
            .then((response) =>
              response
                .json()
                .catch(() => ({}))
                .then((data) => ({ ok: response.ok, status: response.status, data }))
            )
            .then((result) => {
              if (!result.ok) {
                const msg =
                  (result.data &&
                    (result.data.error ||
                      (result.data.errors && result.data.errors.join(', ')))) ||
                  'HTTP ' + result.status
                throw new Error(msg)
              }

              window.opener.postMessage(
                { type: CLIP_DONE, ok: true, data: result.data },
                '*'
              )
              showSuccessActions(result.data)
            })
            .catch((error) => {
              const message = error && error.message ? error.message : String(error)
              setStatus('保存に失敗しました: ' + message)
              window.opener.postMessage(
                { type: CLIP_DONE, ok: false, error: message },
                '*'
              )
            })
        })
      })()
    </script>
  </body>
</html>
